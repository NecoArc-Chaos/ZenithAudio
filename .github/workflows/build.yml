name: Build

on:
  push:
    branches: [ fix/review-p0 ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            flutter_target: apk
            artifact_name: ZenithAudio-android
          - platform: web
            os: ubuntu-latest
            flutter_target: web
            artifact_name: ZenithAudio-web
          - platform: linux
            os: ubuntu-latest
            flutter_target: linux
            artifact_name: ZenithAudio-linux
          - platform: windows
            os: windows-latest
            flutter_target: windows
            artifact_name: ZenithAudio-windows
          - platform: macos
            os: macos-latest
            flutter_target: macos
            artifact_name: ZenithAudio-macos
          - platform: ios
            os: macos-latest
            flutter_target: ios
            artifact_name: ZenithAudio-ios

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Prepare Android signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            cat > key.properties <<EOP
            storeFile=keystore.jks
            storePassword=$KEY_STORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOP
            mv keystore.jks app/
            mv key.properties app/
          fi
        working-directory: ./android

      - name: Prepare iOS/macOS signing
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: |
          if [ -n "$CERT_P12_BASE64" ]; then
            echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
            security create-keychain -p "" build.keychain
            security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security set-keychain-settings build.keychain
          fi

      - name: Build ${{ matrix.platform }}
        run: flutter build ${{ matrix.flutter_target }} --release

      - name: Package ${{ matrix.platform }}
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            android)
              cp android/build/app/outputs/flutter-apk/app-release.apk ${{ matrix.artifact_name }}.apk
              ;;
            web)
              cd build/web && tar -czf ../${{ matrix.artifact_name }}.tar.gz .
              ;;
            linux)
              cd build/linux/x64/release/bundle && tar -czf ../../../../${{ matrix.artifact_name }}.tar.gz .
              ;;
            windows)
              cd build/windows/x64/runner/Release && zip -r ../../../../../${{ matrix.artifact_name }}.zip .
              ;;
            macos)
              cd build/macos/Build/Products/Release && zip -r ../../../../../${{ matrix.artifact_name }}.zip *.app
              ;;
            ios)
              cd build/ios/iphoneos && zip -r ../../../../${{ matrix.artifact_name }}.zip *.ipa || true
              ;;
          esac

      - name: Upload ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.platform == 'android' && 'android/' || '' }}${{ matrix.artifact_name }}.*
          retention-days: 14
